<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Gunung Capital Support</title>

<meta http-equiv="Content-type" content="text/html; charset=UTF-8">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #f4f6f9;
  }

  .page-container {
    max-width: 760px;
    margin: 60px auto;
    background: #ffffff;
    border-radius: 6px;
    padding: 40px 50px 50px;
  }

  .logo-container {
    text-align: center;
    margin-bottom: 20px;
  }

  .logo-container img {
    max-height: 90px;
  }

  h1 {
    text-align: center;
    color: #2b3f8d;
    font-weight: 600;
    margin-bottom: 40px;
  }

  .form-group {
    margin-bottom: 26px;
  }

  label {
    display: block;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    margin-bottom: 10px;
  }

  input[type="text"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #d9d9d9;
    box-sizing: border-box;
  }

  textarea {
    min-height: 140px;
    resize: vertical;
  }

  select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23666' d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 18px;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #2b3f8d;
  }

  .submit-btn {
    width: 100%;
    margin-top: 40px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    background-color: #2b3f8d;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .submit-btn:hover {
    background-color: #223370;
  }
</style>
</head>

<body>

<div class="page-container">

  <!-- LOGO -->
  <div class="logo-container">
    <img src="https://va1767334714252.my.salesforce.com/sfc/dist/version/download/?oid=00DKj00000pTxrb&ids=068Kj00000bTIUrIAO&d=/a/Kj000003695F/oVBwXJh1a7xHAyR3INa6BqQlzK5F.hvhdad9swa8Jy0&operationContext=DELIVERY&viewId=05HKj000000sJ4oMAE&dpt="
         alt="Gunung Capital Logo">
  </div>

  <h1>Contact Gunung Capital Support</h1>

  <form
    action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DKj00000pTxrb"
    method="POST">

    <!-- ✅ REDIRECT TO THANK YOU PAGE -->
    <input type="hidden" name="retURL"
           value="https://chaitalidhande25.github.io/ThankYou/gunung%20thank%20you.html">

    <!-- Salesforce Hidden Fields -->
    <input type="hidden" name="orgid" value="00DKj00000pTxrb">
    <input type="hidden" name="external" value="1">
    <input type="hidden" name="origin" value="Web">
    <input type="hidden" name="Status" value="New">

    <div class="form-group">
      <label>Contact Name</label>
      <input name="name" type="text" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input name="email" type="email" required>
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input name="phone" type="text">
    </div>

    <div class="form-group">
      <label>Order Number</label>
      <input name="00NKa00000fikTT" type="text">
    </div>

    <div class="form-group">
      <label>Subject</label>
      <input name="subject" type="text" required>
    </div>

    <div class="form-group">
      <label>Case Reason</label>
      <select name="reason">
        <option value="">-- Select Reason --</option>
        <option value="Existing problem">Existing problem</option>
        <option value="New problem">New problem</option>
      </select>
    </div>

    <div class="form-group">
      <label>Priority</label>
      <select name="priority">
        <option value="">-- Select Priority --</option>
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description"></textarea>
    </div>

    <button type="submit" class="submit-btn">
      Submit Case
    </button>

  </form>

</div>

</body>
</html>
